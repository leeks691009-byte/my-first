<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>온도 변화 그래프</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #616e7c;
    --line: #d9e2ec;
    --accent: #e4572e;
    --primary: #2f6fdf;
    --ok: #2a9d5c;
    --warn: #b7791f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.5rem; margin: 8px 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font: inherit;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--primary);
    background: var(--primary);
    color: #fff;
    cursor: pointer;
  }
  button.secondary { background: #fff; color: var(--primary); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-left: auto; color: var(--muted); }
  .status b.on { color: var(--ok); }
  .status b.off { color: var(--muted); }
  .notice {
    display: none;
    background: #fff8e6;
    border: 1px solid #f0d58a;
    color: var(--warn);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 16px;
  }
  .flow {
    display: flex;
    align-items: center;
    justify-content: space-around;
    text-align: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .flow .label { font-size: 0.85rem; color: var(--muted); }
  .flow .value { font-size: 2rem; font-weight: bold; font-variant-numeric: tabular-nums; }
  .flow .value.temp { color: var(--accent); }
  .flow .arrow { font-size: 1.5rem; color: var(--muted); }
  .formula { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
  canvas { width: 100%; height: 360px; display: block; }
  .stats { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
  <h1>🌡 온도 변화 그래프</h1>

  <div id="notice" class="notice">
    이 브라우저는 USB 시리얼 연결(Web Serial)을 지원하지 않습니다. <b>Chrome</b> 또는 <b>Edge</b>를 사용하세요.
  </div>

  <section class="card toolbar">
    <button id="connectBtn">연결</button>
    <button id="startBtn" disabled>시작</button>
    <button id="resetBtn" class="secondary">초기화</button>
    <span class="status">상태: <b id="status" class="off">연결 안 됨</b></span>
  </section>

  <section class="card">
    <div class="flow">
      <div>
        <div class="label">아날로그 값 (0~1023)</div>
        <div class="value" id="adcValue">-</div>
      </div>
      <div class="arrow">→</div>
      <div>
        <div class="label">전압</div>
        <div class="value" id="voltValue">- V</div>
      </div>
      <div class="arrow">→</div>
      <div>
        <div class="label">온도</div>
        <div class="value temp" id="tempValue">- °C</div>
      </div>
    </div>
    <div class="formula">전압 = 값 × 5.0 ÷ 1023 &nbsp;·&nbsp; 온도 = 전압 × 100 (LM35)</div>
  </section>

  <section class="card">
    <canvas id="chart"></canvas>
  </section>

  <section class="card stats">
    <span>측정 수: <b id="count">0</b>개</span>
    <span>최저: <b id="min">-</b></span>
    <span>최고: <b id="max">-</b></span>
  </section>
</main>

<script>
  // ----- 설정 -----
  const BAUD_RATE = 9600;
  const VREF = 5.0;      // 아두이노 기준 전압
  const ADC_MAX = 1023;  // 10비트 ADC 최댓값
  const T_MAX = 3600;    // 가로축 최대: 1시간(초)
  const T_TICK = 60;     // 가로축 한 눈금: 1분(초)

  // ----- 상태 -----
  let port = null;
  let reader = null;
  let measuring = false;
  let startTime = null;
  const data = []; // { t: 경과 초, temp: °C }

  // ----- 화면 요소 -----
  const $ = (id) => document.getElementById(id);
  const connectBtn = $("connectBtn");
  const startBtn = $("startBtn");
  const resetBtn = $("resetBtn");
  const statusEl = $("status");
  const canvas = $("chart");
  const ctx = canvas.getContext("2d");

  if (!("serial" in navigator)) {
    $("notice").style.display = "block";
    connectBtn.disabled = true;
  }

  // ----- 변환 -----
  function toVoltage(adc) { return adc * VREF / ADC_MAX; }
  function toCelsius(volt) { return volt * 100; }

  // ----- 연결 / 해제 -----
  connectBtn.addEventListener("click", async () => {
    if (port) { await disconnect(); return; }
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: BAUD_RATE });
      setStatus("연결됨", true);
      connectBtn.textContent = "연결 해제";
      startBtn.disabled = false;
      readLoop();
    } catch (err) {
      port = null;
      if (err.name !== "NotFoundError") alert("연결하지 못했습니다: " + err.message);
    }
  });

  async function disconnect() {
    measuring = false;
    try { if (reader) await reader.cancel(); } catch (e) {}
    try { if (port) await port.close(); } catch (e) {}
    port = null;
    reader = null;
    setStatus("연결 안 됨", false);
    connectBtn.textContent = "연결";
    startBtn.disabled = true;
    startBtn.textContent = "시작";
  }

  navigator.serial?.addEventListener("disconnect", (e) => {
    if (e.target === port) disconnect();
  });

  function setStatus(text, on) {
    statusEl.textContent = text;
    statusEl.className = on ? "on" : "off";
  }

  // ----- 시리얼 한 줄씩 읽기 -----
  async function readLoop() {
    const decoder = new TextDecoderStream();
    const closed = port.readable.pipeTo(decoder.writable).catch(() => {});
    reader = decoder.readable.getReader();
    let buffer = "";
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) handleLine(line.trim());
      }
    } catch (e) {
      // 케이블이 빠지는 등 읽기 오류
    } finally {
      reader.releaseLock();
      await closed;
    }
  }

  function handleLine(line) {
    const adc = Number(line);
    if (line === "" || !Number.isFinite(adc) || adc < 0 || adc > ADC_MAX) return;

    const volt = toVoltage(adc);
    const temp = toCelsius(volt);

    $("adcValue").textContent = Math.round(adc);
    $("voltValue").textContent = volt.toFixed(2) + " V";
    $("tempValue").textContent = temp.toFixed(1) + " °C";

    if (!measuring) return;
    if (startTime === null) startTime = performance.now();
    const t = (performance.now() - startTime) / 1000;
    if (t > T_MAX) { stopMeasuring(); return; } // 1시간이 지나면 자동 정지
    data.push({ t, temp });
    updateStats();
    drawChart();
  }

  // ----- 시작 / 정지 / 초기화 -----
  startBtn.addEventListener("click", () => {
    measuring = !measuring;
    startBtn.textContent = measuring ? "정지" : "시작";
    setStatus(measuring ? "측정 중" : "연결됨", true);
  });

  function stopMeasuring() {
    measuring = false;
    startBtn.textContent = "시작";
    setStatus("1시간 측정 완료", true);
  }

  resetBtn.addEventListener("click", () => {
    data.length = 0;
    startTime = null;
    updateStats();
    drawChart();
  });

  function updateStats() {
    $("count").textContent = data.length;
    if (data.length === 0) {
      $("min").textContent = "-";
      $("max").textContent = "-";
      return;
    }
    const temps = data.map((d) => d.temp);
    $("min").textContent = Math.min(...temps).toFixed(1) + "°C";
    $("max").textContent = Math.max(...temps).toFixed(1) + "°C";
  }

  // ----- 그래프 그리기 (canvas) -----
  function niceStep(range, ticks) {
    const raw = range / ticks;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  }

  function drawChart() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);

    const pad = { left: 56, right: 16, top: 16, bottom: 40 };
    const pw = w - pad.left - pad.right;
    const ph = h - pad.top - pad.bottom;

    // 축 범위
    const tMax = T_MAX;
    let yMin = 15, yMax = 35;
    if (data.length > 0) {
      const temps = data.map((d) => d.temp);
      const lo = Math.min(...temps), hi = Math.max(...temps);
      const margin = Math.max(1, (hi - lo) * 0.15);
      yMin = Math.floor(lo - margin);
      yMax = Math.ceil(hi + margin);
    }
    const x = (t) => pad.left + (t / tMax) * pw;
    const y = (v) => pad.top + (1 - (v - yMin) / (yMax - yMin)) * ph;

    ctx.font = "12px sans-serif";
    ctx.lineWidth = 1;

    // 세로축 눈금 + 격자
    const yStep = niceStep(yMax - yMin, 5);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let v = Math.ceil(yMin / yStep) * yStep; v <= yMax + 1e-9; v += yStep) {
      ctx.strokeStyle = "#e4e7eb";
      ctx.beginPath(); ctx.moveTo(pad.left, y(v)); ctx.lineTo(w - pad.right, y(v)); ctx.stroke();
      ctx.fillStyle = "#616e7c";
      ctx.fillText(Number(v.toFixed(1)) + "°C", pad.left - 6, y(v));
    }

    // 가로축 눈금 + 격자: 1분마다 눈금, 몇 분마다 진한 선과 숫자
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    // 화면이 좁으면 숫자 간격을 5→10→15→30분으로 넓혀 겹치지 않게 함
    const labelEvery = [5, 10, 15, 30].find((m) => (pw / 60) * m >= 44) || 30;
    for (let t = 0; t <= tMax; t += T_TICK) {
      const min = t / 60;
      const major = min % labelEvery === 0;
      ctx.strokeStyle = major ? "#d9e2ec" : "#f0f2f5";
      ctx.beginPath(); ctx.moveTo(x(t), pad.top); ctx.lineTo(x(t), pad.top + ph); ctx.stroke();
      ctx.strokeStyle = "#9aa5b1";
      ctx.beginPath(); ctx.moveTo(x(t), pad.top + ph); ctx.lineTo(x(t), pad.top + ph + (major ? 6 : 3)); ctx.stroke();
      if (major) {
        ctx.fillStyle = "#616e7c";
        ctx.fillText(min + "분", x(t), pad.top + ph + 8);
      }
    }

    // 축선
    ctx.strokeStyle = "#9aa5b1";
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top);
    ctx.lineTo(pad.left, pad.top + ph);
    ctx.lineTo(w - pad.right, pad.top + ph);
    ctx.stroke();

    // 축 제목
    ctx.fillStyle = "#616e7c";
    ctx.fillText("경과 시간", pad.left + pw / 2, h - 16);

    if (data.length === 0) {
      ctx.textBaseline = "middle";
      ctx.fillText("아두이노를 연결하고 [시작]을 누르면 그래프가 그려집니다.", pad.left + pw / 2, pad.top + ph / 2);
      return;
    }

    // 꺾은선
    ctx.strokeStyle = "#e4572e";
    ctx.lineWidth = 2;
    ctx.lineJoin = "round";
    ctx.beginPath();
    data.forEach((d, i) => (i === 0 ? ctx.moveTo(x(d.t), y(d.temp)) : ctx.lineTo(x(d.t), y(d.temp))));
    ctx.stroke();

    // 마지막 점 강조
    const last = data[data.length - 1];
    ctx.fillStyle = "#e4572e";
    ctx.beginPath();
    ctx.arc(x(last.t), y(last.temp), 4, 0, Math.PI * 2);
    ctx.fill();
  }

  window.addEventListener("resize", drawChart);
  drawChart();
</script>
</body>
</html>
